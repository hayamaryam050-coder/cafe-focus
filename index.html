<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cafe Focus</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Quicksand:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --cream: #F7F1E6;
    --beige: #EAD9C2;
    --beige-deep: #D9C4A3;
    --blue: #7FA1B3;
    --blue-deep: #3F6079;
    --blush: #C98F82;
    --matcha: #8FA888;
    --ink: #453B33;
    --ink-soft: #8A7C6D;
    --paper: #FBF6EC;
    --shadow: rgba(69, 59, 51, 0.18);
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0; padding:0; min-height:100%;
    background: var(--cream);
    color: var(--ink);
    font-family: 'Quicksand', sans-serif;
  }

  body{
    padding: 28px 16px 60px;
    display:flex;
    justify-content:center;
  }

  .app{
    width:100%;
    max-width: 980px;
  }

  h1,h2,h3{
    font-family:'Fraunces', 'Georgia', serif;
    font-weight:600;
    margin:0;
  }

  /* ---------- Header ---------- */
  .header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:14px;
    margin-bottom:18px;
  }

  .brand{
    display:flex;
    align-items:center;
    gap:12px;
  }

  .brand-mark{
    width:46px;height:46px;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #fff3, transparent 60%), var(--blue-deep);
    display:flex;align-items:center;justify-content:center;
    font-size:22px;
    box-shadow: 0 3px 8px var(--shadow);
  }

  .brand h1{ font-size: 26px; letter-spacing:0.3px; }
  .brand p{ margin:2px 0 0; font-size:13px; color:var(--ink-soft); }

  .status-pill{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    padding:6px 12px;
    border-radius:20px;
    background: var(--paper);
    border:1px solid var(--beige-deep);
    color: var(--blue-deep);
  }

  /* ---------- Special banner ---------- */
  .special{
    background: linear-gradient(120deg, var(--blush), #d9a89c);
    color: var(--paper);
    border-radius: 16px;
    padding: 14px 20px;
    margin-bottom: 22px;
    display:flex;
    align-items:center;
    gap:16px;
    box-shadow: 0 4px 14px var(--shadow);
  }
  .special .tag{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:0.1em;
    background: rgba(255,255,255,0.25);
    padding:4px 9px;
    border-radius:20px;
    white-space:nowrap;
  }
  .special p{ margin:0; font-size:14px; }
  .special strong{ font-family:'Fraunces', serif; font-weight:600; }
  .special .progress{
    margin-left:auto;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    white-space:nowrap;
  }

  /* ---------- Layout grid ---------- */
  .grid{
    display:grid;
    grid-template-columns: 1.05fr 1fr;
    gap: 22px;
  }
  @media (max-width: 760px){
    .grid{ grid-template-columns: 1fr; }
  }

  .panel{
    background: var(--paper);
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 4px 16px var(--shadow);
    border: 1px solid #ffffffaa;
  }

  .panel h2{
    font-size:16px;
    margin-bottom:12px;
    color: var(--blue-deep);
  }

  /* ---------- Cafe window scene ---------- */
  .scene{
    position:relative;
    border-radius:16px;
    overflow:hidden;
    height:180px;
    margin-bottom:18px;
    transition: background 1.2s ease;
  }
  .scene.morning{ background: linear-gradient(180deg, #FDE9C8, #F3C98E); }
  .scene.afternoon{ background: linear-gradient(180deg, #BFE0EC, #9AC4D6); }
  .scene.evening{ background: linear-gradient(180deg, #E7B9A6, #C98F82); }
  .scene.night{ background: linear-gradient(180deg, #2B3A4A, #1B2733); }

  .scene .frame{
    position:absolute; inset:10px;
    border: 6px solid var(--paper);
    border-radius:10px;
    background: rgba(255,255,255,0.08);
  }
  .scene .rain span{
    position:absolute;
    width:1.5px; height:16px;
    background: rgba(255,255,255,0.5);
    top:-20px;
    animation: fall linear infinite;
  }
  @keyframes fall{ to{ transform: translateY(220px); } }

  .scene .caption{
    position:absolute; bottom:8px; left:16px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color: var(--paper);
    background: rgba(0,0,0,0.25);
    padding:3px 9px;
    border-radius: 20px;
  }

  /* ---------- Tables ---------- */
  .tables{
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap:10px;
    margin-bottom:18px;
  }
  .table-btn{
    border:2px solid transparent;
    background: var(--beige);
    border-radius:14px;
    padding:12px 10px;
    text-align:left;
    cursor:pointer;
    font-family:'Quicksand', sans-serif;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .table-btn:hover{ transform: translateY(-2px); }
  .table-btn.active{
    border-color: var(--blue-deep);
    background: #fff;
  }
  .table-btn .icon{ font-size:20px; }
  .table-btn .name{ font-weight:700; font-size:13.5px; display:block; margin-top:4px; }
  .table-btn .sub{ font-size:11px; color:var(--ink-soft); }

  /* ---------- Shelf of rewards ---------- */
  .shelf{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .shelf-item{
    width:52px; height:52px;
    border-radius:12px;
    background: var(--beige);
    display:flex;align-items:center;justify-content:center;
    font-size:24px;
    border: 1px solid var(--beige-deep);
  }
  .shelf-empty{
    font-size:12.5px;
    color: var(--ink-soft);
    font-style:italic;
  }

  /* ---------- Menu ---------- */
  .menu-list{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .menu-item{
    display:flex;
    align-items:center;
    gap:14px;
    background: var(--beige);
    border-radius:14px;
    padding:12px 14px;
    cursor:pointer;
    border: 2px solid transparent;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .menu-item:hover{ transform: translateX(3px); background:#E4D2B6; }
  .menu-item.disabled{ opacity:0.45; cursor:not-allowed; }
  .menu-item .emoji{ font-size:26px; }
  .menu-item .info{ flex:1; }
  .menu-item .info .name{ font-weight:700; font-size:14.5px; font-family:'Fraunces', serif; }
  .menu-item .info .desc{ font-size:12px; color: var(--ink-soft); }
  .menu-item .time{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color: var(--blue-deep);
    background: var(--paper);
    padding:4px 8px;
    border-radius:10px;
    white-space:nowrap;
  }

  /* ---------- Corkboard / tickets ---------- */
  .corkboard{
    background: #C9A876;
    border-radius:16px;
    padding:16px;
    min-height:120px;
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-content:flex-start;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.15);
  }
  .cork-empty{
    color: #fff8ea;
    font-size:12.5px;
    font-style:italic;
    margin:auto;
  }
  .ticket{
    background: var(--paper);
    width: 120px;
    padding:9px 9px 11px;
    border-radius:2px;
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    line-height:1.5;
    box-shadow: 0 3px 6px rgba(0,0,0,0.25);
    position:relative;
    animation: pin-in 0.4s ease;
  }
  .ticket::before{
    content:'';
    position:absolute; top:-5px; left:50%; transform: translateX(-50%);
    width:10px; height:10px; border-radius:50%;
    background: var(--blush);
    box-shadow: 0 1px 2px rgba(0,0,0,0.4);
  }
  .ticket .t-name{ font-weight:700; font-size:11px; border-bottom:1px dashed #d8cbb5; padding-bottom:4px; margin-bottom:4px; }
  @keyframes pin-in{ from{ opacity:0; transform: translateY(-8px) rotate(0deg); } }

  /* ---------- Overlay (brewing / timer) ---------- */
  .overlay{
    position:fixed; inset:0;
    background: rgba(69,59,51,0.55);
    display:flex; align-items:center; justify-content:center;
    z-index: 50;
    padding: 20px;
  }
  .overlay-card{
    background: var(--paper);
    border-radius: 22px;
    padding: 34px 30px;
    max-width: 380px;
    width:100%;
    text-align:center;
    box-shadow: 0 12px 40px rgba(0,0,0,0.3);
  }
  .cup{
    font-size: 54px;
    margin-bottom: 6px;
    display:inline-block;
    position:relative;
  }
  .steam{
    position:absolute; top:-18px; left:50%; transform:translateX(-50%);
    font-size:16px;
    opacity:0.7;
    animation: steam 2.2s ease-in-out infinite;
  }
  @keyframes steam{
    0%,100%{ transform: translateX(-50%) translateY(0); opacity:0.6; }
    50%{ transform: translateX(-50%) translateY(-10px); opacity:0.9; }
  }
  .timer-display{
    font-family:'Fraunces', serif;
    font-size: 44px;
    font-weight:600;
    color: var(--blue-deep);
    margin: 10px 0 4px;
  }
  .timer-label{ color: var(--ink-soft); font-size:13px; margin-bottom:20px; }

  .ring-wrap{ position:relative; width:150px; height:150px; margin: 0 auto 14px; }
  .ring-wrap svg{ transform: rotate(-90deg); }
  .ring-bg{ stroke: var(--beige); }
  .ring-fg{ stroke: var(--blush); stroke-linecap: round; transition: stroke-dashoffset 1s linear; }

  .btn{
    font-family:'Quicksand', sans-serif;
    font-weight:700;
    font-size:13.5px;
    border:none;
    border-radius: 30px;
    padding: 10px 22px;
    cursor:pointer;
    background: var(--blue-deep);
    color: var(--paper);
    transition: transform 0.15s ease;
  }
  .btn:hover{ transform: translateY(-1px); }
  .btn.ghost{
    background: transparent;
    color: var(--ink-soft);
    border: 1.5px solid var(--beige-deep);
  }
  .btn-row{ display:flex; gap:10px; justify-content:center; margin-top:6px; }

  /* ---------- Reflection form ---------- */
  .reflect-card{ text-align:left; max-width:420px; }
  .reflect-card h3{ font-size:18px; margin-bottom:14px; color:var(--blue-deep); }
  .field{ margin-bottom:14px; }
  .field label{ font-size:12.5px; font-weight:700; display:block; margin-bottom:6px; color:var(--ink); }
  .field input[type=text], .field textarea{
    width:100%;
    border:1.5px solid var(--beige-deep);
    border-radius:10px;
    padding:8px 10px;
    font-family:'Quicksand', sans-serif;
    font-size:13px;
    background: #fff;
    resize:vertical;
  }
  .scale{ display:flex; gap:6px; }
  .scale button{
    flex:1;
    padding:8px 0;
    border-radius:10px;
    border:1.5px solid var(--beige-deep);
    background:#fff;
    cursor:pointer;
    font-size:16px;
  }
  .scale button.sel{ background: var(--blush); border-color: var(--blush); }

  .mood-row{ display:flex; gap:6px; }
  .mood-row button{
    flex:1;
    padding:8px 0;
    font-size:20px;
    border-radius:10px;
    border:1.5px solid var(--beige-deep);
    background:#fff;
    cursor:pointer;
  }
  .mood-row button.sel{ background: var(--matcha); border-color: var(--matcha); }

  /* ---------- Reward toast ---------- */
  .reward-pop{
    text-align:center;
  }
  .reward-pop .big-emoji{ font-size:56px; margin-bottom:10px; }

  footer{
    text-align:center;
    margin-top: 26px;
    font-size: 11.5px;
    color: var(--ink-soft);
  }
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
(function(){

  // ---------- Data ----------
  const MENU = [
    { id:'tea', emoji:'🍵', name:'Green Tea', minutes:15, desc:'Quick revision', night:false },
    { id:'latte', emoji:'☕', name:'Latte', minutes:30, desc:'Focused study', night:false },
    { id:'croissant', emoji:'🥐', name:'Croissant Combo', minutes:45, breakMin:5, desc:'Deep focus + 5 min break', night:false },
    { id:'cake', emoji:'🍰', name:'Cake Special', minutes:60, desc:'Deep work hour', night:false },
    { id:'midnight', emoji:'🌙', name:'Midnight Coffee', minutes:25, desc:'Late-night session', night:true },
  ];

  const TABLES = [
    { id:'maths', icon:'📐', name:'Maths Corner', sub:'Numbers & logic' },
    { id:'science', icon:'🔬', name:'Science Lab', sub:'Experiments & theory' },
    { id:'reading', icon:'📖', name:'Reading Nook', sub:'Books & language' },
    { id:'geo', icon:'🗺️', name:'Geography Patio', sub:'Places & maps' },
  ];

  const REWARD_POOL = [
    { emoji:'🪴', name:'Little Fern' },
    { emoji:'🫖', name:'Ceramic Teapot' },
    { emoji:'🖼️', name:'Framed Print' },
    { emoji:'🕯️', name:'Soft Candle' },
    { emoji:'📔', name:'Study Journal' },
    { emoji:'🪑', name:'Cushioned Chair' },
    { emoji:'🧸', name:'Cafe Cat' },
    { emoji:'🧣', name:'Cosy Blanket' },
    { emoji:'🪟', name:'Lace Curtain' },
    { emoji:'🍮', name:'Pudding Special' },
    { emoji:'🌷', name:'Tulip Vase' },
    { emoji:'📻', name:'Vintage Radio' },
  ];

  const SPECIAL = { name:'Strawberry Matcha Invitation', goal:3, desc:'Enjoy three sessions today, at any pace, for a bonus treat.' };
                  

  // ---------- State (in-memory only) ----------
  let state = {
    selectedTable: null,
    shelf: [],
    tickets: [],
    pendingSession: null,     // {item, table}
    phase: 'idle',            // idle | brewing | running | reflect | reward
    secondsLeft: 0,
    totalSeconds: 0,
    reflect: { studied:'', focus:0, moodBefore:null, moodAfter:null, notes:'' },
    lastReward: null,
    timerHandle: null,
  };

  function timeOfDayClass(){
    const h = new Date().getHours();
    if(h>=5 && h<11) return 'morning';
    if(h>=11 && h<17) return 'afternoon';
    if(h>=17 && h<21) return 'evening';
    return 'night';
  }
  function timeOfDayCaption(){
    const c = timeOfDayClass();
    return { morning:'Soft morning light', afternoon:'Warm afternoon window', evening:'Golden hour, rain on the glass', night:'Quiet, lamplit night' }[c];
  }

  function fmt(sec){
    const m = Math.floor(sec/60).toString().padStart(2,'0');
    const s = Math.floor(sec%60).toString().padStart(2,'0');
    return m+':'+s;
  }

  function render(){
    const app = document.getElementById('app');
    const tod = timeOfDayClass();
    const isNight = tod === 'night';
    const sessionsToday = state.tickets.length;
    const specialDone = sessionsToday >= SPECIAL.goal;

    app.innerHTML = `
      <div class="header">
        <div class="brand">
          <div class="brand-mark">☕</div>
          <div>
            <h1>Cafe Focus</h1>
            <p>a quiet corner for studying, one order at a time</p>
          </div>
        </div>
        <div class="status-pill">${isNight ? 'Open late' : 'Open now'} · ${sessionsToday} order${sessionsToday===1?'':'s'} today</div>
      </div>

      <div class="special">
        <span class="tag">Today's Special</span>
        <p><strong>${SPECIAL.name}.</strong> ${SPECIAL.desc}</p>
        <span class="progress">${specialDone ? '✓ enjoyed' : sessionsToday + ' / ' + SPECIAL.goal}</span>
      </div>

      <div class="grid">
        <div class="panel">
          <h2>Your Cafe</h2>
          <div class="scene ${tod}" id="scene">
            <div class="frame"></div>
            <div class="rain" id="rain"></div>
            <div class="caption">${timeOfDayCaption()}</div>
          </div>

          <h2>Choose a table</h2>
          <div class="tables">
            ${TABLES.map(t => `
              <button class="table-btn ${state.selectedTable===t.id?'active':''}" data-table="${t.id}">
                <span class="icon">${t.icon}</span>
                <span class="name">${t.name}</span>
                <span class="sub">${t.sub}</span>
              </button>
            `).join('')}
          </div>

          <h2>Shelf</h2>
          <div class="shelf">
            ${state.shelf.length ? state.shelf.map(r => `<div class="shelf-item" title="${r.name}">${r.emoji}</div>`).join('')
              : '<span class="shelf-empty">Nothing on the shelf yet — it fills up as you study.</span>'}
          </div>
        </div>

        <div class="panel">
          <h2>Menu</h2>
          <div class="menu-list">
            ${MENU.map(m => {
              const locked = m.night && !isNight;
              return `
              <div class="menu-item ${locked?'disabled':''}" data-item="${m.id}" ${locked?'':''}>
                <span class="emoji">${m.emoji}</span>
                <div class="info">
                  <div class="name">${m.name}</div>
                  <div class="desc">${locked ? 'Available after dark' : m.desc}</div>
                </div>
                <span class="time">${m.minutes}m${m.breakMin?' +'+m.breakMin+'m break':''}</span>
              </div>`;
            }).join('')}
          </div>

          <h2 style="margin-top:18px;">Order Tickets</h2>
          <div class="corkboard">
            ${state.tickets.length ? state.tickets.map(t => `
              <div class="ticket" style="transform:rotate(${t.rot}deg)">
                <div class="t-name">${t.emoji} ${t.name}</div>
                <div>${t.table}</div>
                <div>${t.minutes} min</div>
                <div>focus ${'★'.repeat(t.focus)}${'☆'.repeat(5-t.focus)}</div>
              </div>
            `).join('') : '<div class="cork-empty">Pinned tickets from today&#39;s sessions will appear here.</div>'}
          </div>
        </div>
      </div>

      <footer>This is a working prototype — your cafe resets when you reload the page.</footer>

      ${renderOverlay()}
    `;

    // rain drops
    const rain = document.getElementById('rain');
    if(rain){
      let html = '';
      for(let i=0;i<18;i++){
        const left = Math.random()*100;
        const delay = Math.random()*2;
        const dur = 1 + Math.random()*1.2;
        html += `<span style="left:${left}%; animation-duration:${dur}s; animation-delay:${delay}s;"></span>`;
      }
      rain.innerHTML = html;
    }

    attachEvents();
  }

  function renderOverlay(){
    if(state.phase === 'brewing'){
      const item = state.pendingSession.item;
      return `
        <div class="overlay">
          <div class="overlay-card">
            <div class="cup">${item.emoji}<span class="steam">〰️</span></div>
            <div class="timer-label">Brewing your ${item.name}…</div>
            <div class="btn-row"><button class="btn ghost" id="cancelBrew">Cancel</button></div>
          </div>
        </div>`;
    }
    if(state.phase === 'running'){
      const item = state.pendingSession.item;
      const pct = state.totalSeconds ? (state.secondsLeft/state.totalSeconds) : 0;
      const r = 64, circ = 2*Math.PI*r;
      const offset = circ * pct;
      return `
        <div class="overlay">
          <div class="overlay-card">
            <div class="ring-wrap">
              <svg width="150" height="150">
                <circle cx="75" cy="75" r="${r}" fill="none" stroke-width="10" class="ring-bg"></circle>
                <circle cx="75" cy="75" r="${r}" fill="none" stroke-width="10" class="ring-fg"
                  stroke-dasharray="${circ}" stroke-dashoffset="${offset}"></circle>
              </svg>
              <div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:34px;">${item.emoji}</div>
            </div>
            <div class="timer-display">${fmt(state.secondsLeft)}</div>
            <div class="timer-label">${item.name} · ${state.selectedTable ? TABLES.find(t=>t.id===state.selectedTable).name : 'No table chosen'}</div>
            <div class="btn-row"><button class="btn ghost" id="cancelRun">End early</button></div>
          </div>
        </div>`;
    }
    if(state.phase === 'reflect'){
      const item = state.pendingSession.item;
      return `
        <div class="overlay">
          <div class="overlay-card reflect-card">
            <h3>How was your ${item.name}?</h3>
            <div class="field">
              <label>What did you study?</label>
              <input type="text" id="r-studied" placeholder="e.g. algebra, chapter 4..." value="${state.reflect.studied}">
            </div>
            <div class="field">
              <label>How focused did it feel?</label>
              <div class="scale" id="r-focus">
                ${[1,2,3,4,5].map(n=>`<button data-n="${n}" class="${state.reflect.focus===n?'sel':''}">${n}</button>`).join('')}
              </div>
            </div>
            <div class="field">
              <label>Mood before → after</label>
              <div class="mood-row" id="r-mood">
                ${['😩','😕','😐','🙂','😊'].map((e,i)=>`<button data-m="${i}" class="before ${state.reflect.moodBefore===i?'sel':''}">${e}</button>`).join('')}
              </div>
              <div class="mood-row" id="r-mood-after" style="margin-top:6px;">
                ${['😩','😕','😐','🙂','😊'].map((e,i)=>`<button data-m="${i}" class="after ${state.reflect.moodAfter===i?'sel':''}">${e}</button>`).join('')}
              </div>
            </div>
            <div class="field">
              <label>Notes (optional)</label>
              <textarea id="r-notes" rows="2" placeholder="anything worth remembering...">${state.reflect.notes}</textarea>
            </div>
            <div class="btn-row"><button class="btn" id="r-submit">Close the tab</button></div>
          </div>
        </div>`;
    }
    if(state.phase === 'reward'){
      const rw = state.lastReward;
      return `
        <div class="overlay">
          <div class="overlay-card reward-pop">
            ${rw ? `
              <div class="big-emoji">${rw.emoji}</div>
              <h3>You earned: ${rw.name}</h3>
              <p style="color:var(--ink-soft); font-size:13px;">It's been added to your shelf.</p>
            ` : `
              <div class="big-emoji">☕</div>
              <h3>Session complete</h3>
              <p style="color:var(--ink-soft); font-size:13px;">Your shelf is already full of today's finds — thank you for studying.</p>
            `}
            <div class="btn-row"><button class="btn" id="r-done">Back to the cafe</button></div>
          </div>
        </div>`;
    }
    return '';
  }

  function attachEvents(){
    document.querySelectorAll('.table-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        state.selectedTable = btn.dataset.table;
        render();
      });
    });

    document.querySelectorAll('.menu-item').forEach(el=>{
      if(el.classList.contains('disabled')) return;
      el.addEventListener('click', ()=>{
        const item = MENU.find(m=>m.id===el.dataset.item);
        startOrder(item);
      });
    });

    const cancelBrew = document.getElementById('cancelBrew');
    if(cancelBrew) cancelBrew.addEventListener('click', ()=>{ state.phase='idle'; state.pendingSession=null; render(); });

    const cancelRun = document.getElementById('cancelRun');
    if(cancelRun) cancelRun.addEventListener('click', ()=>{
      clearInterval(state.timerHandle);
      state.phase = 'reflect';
      render();
    });

    const focusScale = document.getElementById('r-focus');
    if(focusScale) focusScale.querySelectorAll('button').forEach(b=>{
      b.addEventListener('click', ()=>{ state.reflect.focus = parseInt(b.dataset.n); render(); });
    });

    const moodBefore = document.getElementById('r-mood');
    if(moodBefore) moodBefore.querySelectorAll('button.before').forEach(b=>{
      b.addEventListener('click', ()=>{ state.reflect.moodBefore = parseInt(b.dataset.m); render(); });
    });
    const moodAfter = document.getElementById('r-mood-after');
    if(moodAfter) moodAfter.querySelectorAll('button.after').forEach(b=>{
      b.addEventListener('click', ()=>{ state.reflect.moodAfter = parseInt(b.dataset.m); render(); });
    });

    const studiedInput = document.getElementById('r-studied');
    if(studiedInput) studiedInput.addEventListener('input', (e)=>{ state.reflect.studied = e.target.value; });
    const notesInput = document.getElementById('r-notes');
    if(notesInput) notesInput.addEventListener('input', (e)=>{ state.reflect.notes = e.target.value; });

    const submit = document.getElementById('r-submit');
    if(submit) submit.addEventListener('click', finishReflection);

    const rDone = document.getElementById('r-done');
    if(rDone) rDone.addEventListener('click', ()=>{
      state.phase = 'idle';
      state.pendingSession = null;
      state.lastReward = null;
      state.reflect = { studied:'', focus:0, moodBefore:null, moodAfter:null, notes:'' };
      render();
    });
  }

  function startOrder(item){
    state.pendingSession = { item, table: state.selectedTable };
    state.phase = 'brewing';
    render();
    setTimeout(()=>{
      if(state.phase !== 'brewing') return; // was cancelled
      state.totalSeconds = item.minutes * 60;
      state.secondsLeft = state.totalSeconds;
      state.phase = 'running';
      render();
      state.timerHandle = setInterval(()=>{
        state.secondsLeft -= 1;
        if(state.secondsLeft <= 0){
          clearInterval(state.timerHandle);
          state.phase = 'reflect';
        }
        render();
      }, 1000);
    }, 1400);
  }

  function finishReflection(){
    const item = state.pendingSession.item;
    const tableName = state.pendingSession.table ? TABLES.find(t=>t.id===state.pendingSession.table).name : 'No table';

    // pin a ticket
    state.tickets.push({
      emoji: item.emoji,
      name: item.name,
      table: tableName,
      minutes: item.minutes,
      focus: state.reflect.focus || 3,
      rot: (Math.random()*10 - 5).toFixed(1),
    });

    // grant a reward if any remain unclaimed
    const unclaimed = REWARD_POOL.filter(r => !state.shelf.find(s => s.name === r.name));
    if(unclaimed.length){
      const reward = unclaimed[Math.floor(Math.random()*unclaimed.length)];
      state.shelf.push(reward);
      state.lastReward = reward;
    } else {
      state.lastReward = null;
    }

    state.phase = 'reward';
    render();
  }

  render();
  // keep the window scene gently alive even if left open
  setInterval(()=>{ if(state.phase==='idle') render(); }, 60000);
})();
</script>
</body>
</html>
